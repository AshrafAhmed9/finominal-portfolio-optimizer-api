[tool.pytest.ini_options]
# Without this, bare `pytest` (as opposed to `python -m pytest`) does not
# add the repo root to sys.path, so `from app... import ...` in
# tests/conftest.py fails with "No module named 'app'" - this makes both
# invocations work identically regardless of the reviewer's habit or
# current working directory (as long as it's the repo root).
pythonpath = ["."]
testpaths = ["tests"]
